<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MaxiGaming – Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

<div id="login-screen" class="admin-login">
  <div class="admin-login-box">
    <h1>MaxiGaming Admin</h1>
    <p>Passwort eingeben, um Produkte zu verwalten.</p>
    <input id="password-input" type="password" placeholder="Admin-Passwort" />
    <button id="login-btn" class="btn btn-primary">Anmelden</button>
    <p id="login-error" class="admin-error" hidden>Falsches Passwort.</p>
  </div>
</div>

<div id="admin-app" class="admin-app" hidden>
  <header class="admin-header">
    <h1>MaxiGaming – Produkte verwalten</h1>
    <button id="new-product-btn" class="btn btn-primary">+ Neues Produkt</button>
  </header>

  <div id="product-list" class="admin-product-list"></div>

  <div id="editor-overlay" class="admin-overlay" hidden>
    <div class="admin-editor">
      <button id="editor-close" class="checkout-close" aria-label="Schließen">×</button>
      <h2 id="editor-title">Neues Produkt</h2>
      <form id="product-form">
        <input type="hidden" id="p-id" />

        <label>Name
          <input id="p-name" type="text" required />
        </label>

        <label>Kurzbeschreibung (tagline)
          <input id="p-tagline" type="text" />
        </label>

        <label>Ziel-Auflösung / Tag (z. B. "1440p @ 144Hz")
          <input id="p-target" type="text" />
        </label>

        <div class="form-row">
          <label>Preis
            <input id="p-price" type="number" step="0.01" min="0" required />
          </label>
          <label>Währung
            <select id="p-currency">
              <option value="EUR">EUR</option>
              <option value="CHF">CHF</option>
              <option value="GBP">GBP</option>
              <option value="USD">USD</option>
              <option value="DKK">DKK</option>
              <option value="NOK">NOK</option>
              <option value="SEK">SEK</option>
              <option value="PLN">PLN</option>
              <option value="CZK">CZK</option>
              <option value="HUF">HUF</option>
            </select>
          </label>
        </div>
        <p class="admin-hint">Muss zur Länderwährung deines SumUp-Kontos passen, sonst lehnt SumUp die Zahlung ab.</p>

        <label>Technische Daten (ein Eintrag pro Zeile, Format <code>Bezeichnung: Wert</code>)
          <textarea id="p-specs" rows="6" placeholder="CPU: AMD Ryzen 7 7700
GPU: RTX 4070 SUPER 12GB
RAM: 32GB DDR5-6000"></textarea>
        </label>

        <label>Bilder (mehrere möglich, werden automatisch verkleinert)
          <input id="p-images" type="file" accept="image/*" multiple />
        </label>
        <div id="image-preview" class="image-preview"></div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Speichern</button>
          <button type="button" id="delete-btn" class="btn btn-outline admin-danger" hidden>Löschen</button>
        </div>
        <p id="form-status" class="admin-status"></p>
      </form>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
